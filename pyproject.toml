[project]
name = "video-events"
version = "0.2.0"
description = "Offline single-camera vehicle crossing counter"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0",
  "numpy==1.26.4", "opencv-python==4.10.0.84",
  "ultralytics>=8.3,<8.4", "PyYAML>=6,<7", "lap>=0.5.12,<0.6",
]

[dependency-groups]
dev = ["ruff>=0.8,<1"]

[project.scripts]
video-events = "video_events.cli:main"

[project.optional-dependencies]
plates = [
    "fast-alpr[onnx]==0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Обе сборки OpenCV записывают один и тот же модуль cv2. Используем уже
# установленный opencv-python, в том числе для зависимостей FastALPR.
exclude-dependencies = ["opencv-python-headless"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
