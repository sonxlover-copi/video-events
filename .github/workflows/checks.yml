name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      # Геометрия и оценка событий не требуют GPU, модели или датасета.
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff check src scripts tests
      - run: uv run --no-sync ruff format --check src scripts tests
      - run: uv run --no-sync python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  attributes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --only-group dev
      # Проверяем обработку изображений без загрузки PyTorch и OCR-моделей.
      - run: uv pip install --no-config --python .venv/bin/python numpy==1.26.4 opencv-python-headless==4.10.0.84
      - run: |
          uv run --no-sync python -c "import cv2; import numpy"
          uv run --no-sync python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
